# RADESK: compila solo Windows (x64) y publica el instalador en la release "radesk".
name: RADESK - Compilar Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compilar:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "radesk"
      only-windows: true
