# RADESK: actualiza librerias con avisos de seguridad (cargo audit) y guarda Cargo.lock.
name: RACHDEK - Actualizar dependencias
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Actualizar librerias vulnerables (compatibles con Rust 1.75)
        env:
          # Elegir solo versiones compatibles con rust-version = 1.75 (Cargo.toml)
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          # Partir siempre del Cargo.lock original de la base
          git show "$(git rev-list --max-parents=0 HEAD | tail -1)":Cargo.lock > Cargo.lock
          for p in crossbeam-channel openssl rustls quinn-proto quinn-udp zstd-safe zstd-sys libz-sys \
                   quick-xml@0.30.0 quick-xml@0.31.0 quick-xml@0.37.5 time@0.3.36; do
            cargo update -p "$p" || echo "No se pudo actualizar $p"
          done
          git diff --stat Cargo.lock
      - name: Informe cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit || true
      - name: Guardar Cargo.lock
        run: |
          git config user.name "RADESK"
          git config user.email "radesk@localhost"
          git add Cargo.lock
          git commit -m "RADESK: actualizar dependencias con avisos de seguridad" || echo "Sin cambios"
          git push
